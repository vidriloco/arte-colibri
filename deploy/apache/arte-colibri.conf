# Apache vhost template for Arte Colibrí — reverse proxy to the Docker stack
# on :8100.
#
# You normally never install this by hand: `./scripts/prod.sh up` (or
# `./scripts/prod.sh apache`) substitutes APP_DOMAIN from .env for the
# artecolibri.mx placeholder, enables the needed modules, installs the vhost
# into /etc/apache2/sites-available/ and reloads Apache. Only Apache itself
# (`sudo apt install apache2`) and the TLS certificate are manual:
#   sudo certbot --apache -d <domain> -d www.<domain>
# certbot rewrites the :443 vhost to point at the issued certificates.

<VirtualHost *:80>
    ServerName artecolibri.mx
    ServerAlias www.artecolibri.mx

    # Everything moves to HTTPS (certbot adds an equivalent rule on its own;
    # keeping it explicit here doesn't hurt).
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName artecolibri.mx
    ServerAlias www.artecolibri.mx

    SSLEngine on
    # Placeholder paths — certbot --apache replaces these with the live certs.
    SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key

    # Django (gunicorn in Docker) listens on 127.0.0.1:8100. Keep the browser's
    # Host header (ProxyPreserveHost) so ALLOWED_HOSTS and generated absolute
    # URLs are based on the public domain, and tell Django the original scheme
    # so SECURE_PROXY_SSL_HEADER marks the request as secure.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8100/
    ProxyPassReverse / http://127.0.0.1:8100/
    RequestHeader set X-Forwarded-Proto "https"

    # Artwork uploads can be a few MB; keep the proxy from buffering forever.
    ProxyTimeout 60
    LimitRequestBody 26214400

    ErrorLog  ${APACHE_LOG_DIR}/arte-colibri-error.log
    CustomLog ${APACHE_LOG_DIR}/arte-colibri-access.log combined
</VirtualHost>
