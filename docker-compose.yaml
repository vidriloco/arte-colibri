# Base configuration shared by every environment.
#   dev  (default):  ./scripts/dev.sh           -> merges docker-compose.override.yml
#   prod:            ./scripts/prod.sh           -> merges docker-compose.prod.yml
#
# An explicit project name namespaces every container/volume/network as
# "arte-colibri-*" so they never clash with other apps on the same host
# (e.g. container arte-colibri-db-1, volume arte-colibri_postgres_data).
name: arte-colibri
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: arte-colibri-app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tenochtitlan
      DB_USER: tlaloc
      DB_PASSWORD: passw0rd
      # User-uploaded media (artwork images, avatars) live on a named volume so
      # they survive container replacement.
      MEDIA_ROOT: /usr/src/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - media:/usr/src/app/media
    restart: unless-stopped

  db:
    image: postgis/postgis:14-3.1-alpine
    environment:
      POSTGRES_DB: tenochtitlan
      POSTGRES_USER: tlaloc
      POSTGRES_PASSWORD: passw0rd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlaloc -d tenochtitlan"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  backend:

volumes:
  postgres_data:
  media:
