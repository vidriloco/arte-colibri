# Production overrides. NOT applied automatically — opt in explicitly:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yml up -d --build
#
# No bind mount here: the image's baked-in code is served as-is.
services:
  app:
    # Bind to loopback only: Apache terminates TLS on the host and proxies to
    # 127.0.0.1:8100 (see deploy/apache/), so the app is never exposed directly.
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      # Prod-only Django hardening (interpolated from the .env scripts/prod.sh
      # maintains). Everything else — DB, Turnstile, AWS — is inherited from
      # docker-compose.yaml and filled from the same .env.
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?missing — run scripts/prod.sh up to generate .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    # Production WSGI server (replaces the image's default runserver CMD).
    command: gunicorn --chdir geodjango geodjango.wsgi:application --bind 0.0.0.0:8000 --workers 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  db:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
